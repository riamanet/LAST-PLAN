name: Build LAST PLAN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'LAST_PLAN_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip LAST PLAN project
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q LAST_PLAN_Android_Project.zip -d build-src

      - name: Center guild login field text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('build-src/LAST_PLAN_Android/app/src/main/assets/index.html')
          source = index.read_text(encoding='utf-8')
          anchor = '/* Use a single final baseline offset for both placeholder and typed values.'
          start = source.find(anchor)
          if start == -1:
              raise RuntimeError('Expected login input alignment styles were not found')
          end = source.find('</style>', start)
          block = source[start:end]
          before = 'transform:translateY(-2px)!important;'
          after = 'transform:translateY(2px)!important;'
          if block.count(before) != 1:
              raise RuntimeError('Expected login baseline rule was not found exactly once')
          source = source[:start] + block.replace(before, after, 1) + source[end:]
          # Keep the guild name at +2px; lower only the guild code to +4px.
          if source.count('id="loginGuildCode"') != 1:
              raise RuntimeError('Expected login guild code field was not found exactly once')
          rule = '\n#loginScreen #loginGuildCode{transform:translateY(4px)!important;}\n'
          style_end = source.find('</style>', start)
          source = source[:style_end] + rule + source[style_end:]
          index.write_text(source, encoding='utf-8')
          print('Guild name: +2px; guild code: +4px (additional 2px lower).')
          PY

      - name: Include guild name in bug reports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          assets = Path('build-src/LAST_PLAN_Android/app/src/main/assets')
          index = assets / 'index.html'
          source = index.read_text(encoding='utf-8')
          target = '      guildId:ctx.guild.guildId||ctx.key,'
          if source.count(target) != 1:
              raise RuntimeError('Bug-report guild field not found exactly once')
          source = source.replace(
              target,
              target + "\n      guildName:String(ctx.guild.guildName||'').trim(),",
              1
          )
          index.write_text(source, encoding='utf-8')

          bridge = assets / 'firebase-sync.js'
          source = bridge.read_text(encoding='utf-8')
          old = "id: report.id, content: report.content, screen: report.screen || ''"
          new = (
              "id: report.id, content: report.content, "
              "screen: JSON.stringify({__lastPlanGuildMeta:1, "
              "guildName:String(report.guildName||'').trim(), "
              "screen:String(report.screen||'')})"
          )
          if source.count(old) != 1:
              raise RuntimeError('Bug-report Firebase bridge not found exactly once')
          source = source.replace(old, new, 1)
          bridge.write_text(source, encoding='utf-8')
          print('Guild names will be included in new bug reports.')
          PY

