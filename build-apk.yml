      - name: Fix Settings admin mode button in the gift position
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('build-src/LAST_PLAN_Android/app/src/main/assets/index.html')
          html = path.read_text(encoding='utf-8')
          marker = 'lastplan-settings-admin-stable-v2'
          if marker in html:
              print('Stable Settings admin mode button already included')
              raise SystemExit(0)

          # Keep the SAME original permission-checked button and click handler.
