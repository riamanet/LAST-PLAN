      - name: Adapt widget row spacing to actual home-screen widget height
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          base = Path('build-src/LAST_PLAN_Android/app/src/main/res')
          A = '{http://schemas.android.com/apk/res/android}'
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          def a(name): return A + name
          def is_id(element, suffix):
              return (element.get(a('id'), '')).endswith('/' + suffix)

          # The previous fixed-height widget rows caused six entries to be
          # clipped when Samsung Home resized the widget. Use measured parent
          # height and Android LinearLayout weights instead of a fixed 34dp.
          main = base / 'layout' / 'widget_last_plan.xml'
          if not main.is_file():
              raise RuntimeError('Widget host layout missing')
          tree = ET.parse(main)
          frame = tree.getroot()
          if not frame.tag.endswith('FrameLayout'):
              raise RuntimeError('Unexpected widget root; no changes written')
          cards = [x for x in frame if x.tag.endswith('LinearLayout')]
          if len(cards) != 1:
              raise RuntimeError('Expected one vertical widget card container')
          card = cards[0]
          card.set(a('layout_height'), 'match_parent')
          card.set(a('orientation'), 'vertical')
          card.set(a('paddingTop'), '6dp')
          card.set(a('paddingBottom'), '6dp')

          widget_rows = [x for x in card.iter() if is_id(x, 'widget_rows')]
          if len(widget_rows) != 1 or widget_rows[0] not in list(card):
              raise RuntimeError('Widget rows must be a direct child of the card')
          rows = widget_rows[0]
          rows.set(a('layout_height'), '0dp')
          rows.set(a('layout_weight'), '1')
          rows.set(a('orientation'), 'vertical')
          # Give the tabs and first row a clear gap, and keep the final
          # row separated from the app button. Preserve the six flexible rows.
          rows.set(a('paddingTop'), '12dp')
          rows.set(a('paddingBottom'), '10dp')

          # Keep header and actions fixed, leaving all extra (or reduced)
          # space to be divided evenly among the visible rows.
          header = [x for x in card.iter() if is_id(x, 'widget_header')]
          if len(header) != 1:
              raise RuntimeError('Missing widget header')
          header[0].set(a('layout_height'), '24dp')
          tab_containers = [x for x in card if any(is_id(c, 'widget_tab_survival') for c in x.iter())]
          footer_containers = [x for x in card if any(is_id(c, 'widget_open_app') for c in x.iter())]
          if len(tab_containers) != 1 or len(footer_containers) != 1:
              raise RuntimeError('Missing widget tabs or footer')
          tabs, footer = tab_containers[0], footer_containers[0]
          if rows in (tabs, footer):
              raise RuntimeError('Widget structural mismatch')
          tabs.set(a('layout_height'), '32dp')
          tabs.set(a('layout_marginTop'), '6dp')
          footer.set(a('layout_height'), '30dp')
          footer.set(a('layout_marginTop'), '2dp')
          tree.write(main, encoding='utf-8', xml_declaration=True)

          # Rows used to have weight=1, so with only 3 tasks each row
          # stretched to one third of the entire large widget. Instead,
          # cap each row at a readable height. The parent still fills the
          # widget so the app button remains anchored at the bottom.
          changed = []
          for path in sorted((base / 'layout').glob('widget_row_*.xml')):
              tree = ET.parse(path)
              root = tree.getroot()
              if not root.tag.endswith('LinearLayout'):
                  continue
              if len(root) < 2:
                  continue
              bodies = [child for child in root if child.tag.endswith('LinearLayout')]
              if len(bodies) != 1:
                  continue
              body = bodies[0]
              labels = [child for child in body if is_id(child, 'widget_row_time') or is_id(child, 'widget_row_title')]
              if len(labels) != 2:
                  continue
              if not any(is_id(c, 'widget_row_divider') for c in root):
                  # Some variants have an unlabelled divider. Any 1dp TextView
                  # immediately following the body is an acceptable divider.
                  other = [c for c in root if c is not body]
                  if len(other) != 1 or not other[0].tag.endswith('TextView'):
                      continue
              # 3-4 task views may expand modestly, but never balloon.
              # Six Survival rows stay compact and legible.
              is_survival = 'survival' in path.name
              is_guildwar = 'guild' in path.name or 'war' in path.name
              body_height = '30dp' if is_survival else ('48dp' if is_guildwar else '40dp')
              root.set(a('layout_height'), 'wrap_content')
              root.set(a('layout_weight'), '0')
              root.set(a('orientation'), 'vertical')
              root.set(a('minHeight'), '0dp')
              body.set(a('layout_height'), body_height)
              body.set(a('layout_weight'), '0')
              body.set(a('minHeight'), '0dp')
              body.set(a('paddingTop'), '1dp')
              body.set(a('paddingBottom'), '1dp')
              for label in labels:
                  label.set(a('layout_height'), 'match_parent')
                  label.set(a('minHeight'), '0dp')
                  # Keep the original textSize/color/maxLines; only center it.
                  label.set(a('gravity'), 'center_vertical')
              tree.write(path, encoding='utf-8', xml_declaration=True)
              changed.append(path.name)

          if not {'widget_row_survival.xml', 'widget_row_survival_silver_highlight.xml'}.issubset(set(changed)):
              raise RuntimeError('Missing normal/silver Survival row layouts')
          if len(changed) < 6:
              raise RuntimeError(f'Not enough widget row variants updated: {changed}')

          # The six rows need a readable minimum size. The visual layout
          # expands/contracts above that limit, without shrinking font sizes.
          info = base / 'xml' / 'last_plan_widget_info.xml'
          if info.is_file():
              info_tree = ET.parse(info)
              root = info_tree.getroot()
              root.set(a('minResizeHeight'), '245dp')
              root.set(a('targetCellHeight'), '4')
              info_tree.write(info, encoding='utf-8', xml_declaration=True)

          print('Widget card fills host height; task row height is capped (no excessive gaps)')
          print('Updated row variants: ' + ', '.join(changed))
          PY

