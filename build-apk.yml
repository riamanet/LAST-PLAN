                    // Old directory can only disappear when this leader atomically
                    // commits a new name, a new matching directory, and a new hash.
                    allow delete: if signedIn()
                      && validJoinHash(joinHash)
                      && resource.data.ownerUid == request.auth.uid
                      && exists(guildPath(resource.data.guildId))
                      && leader(resource.data.guildId)
                      && get(guildPath(resource.data.guildId)).data.ownerUid == request.auth.uid
                      && get(guildPath(resource.data.guildId)).data.joinCodeHash == joinHash
                      && getAfter(guildPath(resource.data.guildId)).data.ownerUid == request.auth.uid
                      && getAfter(guildPath(resource.data.guildId)).data.name != get(guildPath(resource.data.guildId)).data.name
                      && getAfter(guildPath(resource.data.guildId)).data.joinCodeHash != joinHash
                      && existsAfter(directoryPath(getAfter(guildPath(resource.data.guildId)).data.joinCodeHash))
                      && getAfter(directoryPath(getAfter(guildPath(resource.data.guildId)).data.joinCodeHash)).data.guildId == resource.data.guildId
                      && getAfter(directoryPath(getAfter(guildPath(resource.data.guildId)).data.joinCodeHash)).data.ownerUid == request.auth.uid;
                  }

              ''').strip('\n')
              directory=textwrap.indent(directory,'    ')+'\n\n'
              s=s[:start]+directory+s[stop:]

              original='''      // A rename, invite-code change, ownership transfer, and deletion require
                // dedicated atomic workflows that also update directory and roles.
                allow update, delete: if false;'''
              updated='''      // Guild leaders may change the guild NAME ONLY. The directory is
                // rotated atomically, while owner, guild ID and all subcollections remain.
                allow update: if signedIn()
                  && leader(gid)
                  && resource.data.ownerUid == request.auth.uid
                  && request.resource.data.ownerUid == resource.data.ownerUid
                  && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['name','joinCodeHash','updatedAt'])
                  && request.resource.data.diff(resource.data).affectedKeys().hasAll(['name','joinCodeHash'])
                  && request.resource.data.name is string
                  && request.resource.data.name.size() > 0
                  && request.resource.data.name.size() <= 30
                  && request.resource.data.name != resource.data.name
                  && validJoinHash(request.resource.data.joinCodeHash)
                  && request.resource.data.joinCodeHash != resource.data.joinCodeHash
                  && exists(directoryPath(resource.data.joinCodeHash))
                  && get(directoryPath(resource.data.joinCodeHash)).data.guildId == gid
                  && get(directoryPath(resource.data.joinCodeHash)).data.ownerUid == request.auth.uid
                  && !existsAfter(directoryPath(resource.data.joinCodeHash))
                  && existsAfter(directoryPath(request.resource.data.joinCodeHash))
                  && getAfter(directoryPath(request.resource.data.joinCodeHash)).data.guildId == gid
                  && getAfter(directoryPath(request.resource.data.joinCodeHash)).data.ownerUid == request.auth.uid;
                // Guild code changes, ownership transfers, and deletion remain blocked.
                allow delete: if false;'''
              s=replace_one(s,original,updated,'FireStore only guild name update')
              return s


          def main():
              for path in [JAVA, HTML, JS, RULES]:
                  if not path.exists():
                      raise FileNotFoundError(path)
              new_bridge=patch_bridge(JAVA.read_text(encoding='utf-8'))
              new_html=patch_html(HTML.read_text(encoding='utf-8'))
              new_js=patch_js(JS.read_text(encoding='utf-8'))
              new_rules=patch_rules(RULES.read_text(encoding='utf-8'))
              # Each file is parsed/replaced in memory first; only after all checks
              # succeed are any changes written to the build directory.
              for path, data in [(JAVA,new_bridge),(HTML,new_html),(JS,new_js),(RULES,new_rules)]:
                  path.write_text(data,encoding='utf-8')
              print('Guild name rename: native transaction, Firestore authorization, live sync and UI installed')

          if __name__ == '__main__':
              main()
          PY
          node --check build-src/LAST_PLAN_Android/app/src/main/assets/firebase-sync.js

      - name: Collect guild identity source for server-safe rename implementation
        run: |
          set -euo pipefail
          SOURCE="build-src/LAST_PLAN_Android"
          mkdir -p guild-identity-source
          BRIDGE=$(find "$SOURCE/app/src/main/java" -type f -name 'LastPlanBridge.java' -print -quit)
          test -n "$BRIDGE" || (echo "LastPlanBridge.java missing" && exit 1)
          cp "$BRIDGE" guild-identity-source/LastPlanBridge.java
          RULES=$(find "$SOURCE" -type f -name 'firestore.rules' -print -quit)
          if [ -n "$RULES" ]; then cp "$RULES" guild-identity-source/firestore.rules; fi
          echo "Native bridge captured for verifying guild rename access checks; no keys or secrets included."

      - name: Upload guild identity source for later native rename fix
        uses: actions/upload-artifact@v4
        with:
          name: LASTPLAN-GUILD-IDENTITY-SOURCE
          path: guild-identity-source/
          if-no-files-found: error

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/LAST_PLAN_release.jks"

      - name: Build release APK
        working-directory: build-src/LAST_PLAN_Android
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign APK with fixed key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          mkdir -p dist
          UNSIGNED="build-src/LAST_PLAN_Android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/LAST-PLAN-aligned.apk"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/LAST_PLAN_release.jks" \
            --ks-key-alias lastplan \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out dist/LAST-PLAN.apk \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs dist/LAST-PLAN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAST-PLAN-APK
          path: dist/LAST-PLAN.apk
          if-no-files-found: error
