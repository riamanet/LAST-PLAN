
name: Build LAST PLAN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'LAST_PLAN_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip LAST PLAN project
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q LAST_PLAN_Android_Project.zip -d build-src

      - name: Center guild login field text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path(
              'build-src/LAST_PLAN_Android/app/src/main/assets/index.html'
          )
          source = index.read_text(encoding='utf-8')

          anchor = (
              '/* Use a single final baseline offset '
              'for both placeholder and typed values.'
          )

          start = source.find(anchor)

          if start == -1:
              raise RuntimeError(
                  'Expected login input alignment styles were not found'
              )

          end = source.find('</style>', start)
          block = source[start:end]

          before = 'transform:translateY(-2px)!important;'
          after = 'transform:translateY(2px)!important;'

          if block.count(before) != 1:
              raise RuntimeError(
                  'Expected login baseline rule was not found exactly once'
              )

          source = (
              source[:start]
              + block.replace(before, after, 1)
              + source[end:]
          )

          # Keep guild name at +2px.
          # Lower only guild code to +4px.
          if source.count('id="loginGuildCode"') != 1:
              raise RuntimeError(
                  'Expected login guild code field was not found exactly once'
              )

          rule = (
              '\n#loginScreen #loginGuildCode'
              '{transform:translateY(4px)!important;}\n'
          )

          style_end = source.find('</style>', start)

          source = (
              source[:style_end]
              + rule
              + source[style_end:]
          )

          index.write_text(source, encoding='utf-8')

          print(
              'Guild name: +2px; '
              'guild code: +4px (additional 2px lower).'
          )
          PY

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/LAST_PLAN_release.jks"

      - name: Build release APK
        working-directory: build-src/LAST_PLAN_Android
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign APK with fixed key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)

          mkdir -p dist

          UNSIGNED="build-src/LAST_PLAN_Android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/LAST-PLAN-aligned.apk"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/LAST_PLAN_release.jks" \
            --ks-key-alias lastplan \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out dist/LAST-PLAN.apk \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs dist/LAST-PLAN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAST-PLAN-APK
          path: dist/LAST-PLAN.apk
          if-no-files-found: error
