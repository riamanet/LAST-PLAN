name: Build LAST PLAN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'LAST_PLAN_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip LAST PLAN project
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q LAST_PLAN_Android_Project.zip -d build-src

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/LAST_PLAN_release.jks"

      - name: Build release APK
        working-directory: build-src/LAST_PLAN_Android
        run: gradle :app:assembleRelease --no-daemon

      - name: Sign APK with fixed key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          mkdir -p dist
          UNSIGNED="build-src/LAST_PLAN_Android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/LAST-PLAN-aligned.apk"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/LAST_PLAN_release.jks" \
            --ks-key-alias lastplan \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out dist/LAST-PLAN.apk \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs dist/LAST-PLAN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAST-PLAN-APK
          path: dist/LAST-PLAN.apk
          if-no-files-found: error
