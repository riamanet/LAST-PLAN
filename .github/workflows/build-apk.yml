            pointer-events:auto!important;
          }
          #memberMode .member-top #memberSettingsModeSwitch[hidden]{display:none!important;}
          </style>'''
          if html.count('</head>') != 1:
              raise RuntimeError('HTML head structure changed')
          html = html.replace('</head>', style + '\n</head>', 1)

          if html.count('id="memberSettingsModeSwitch"') != 1:
              raise RuntimeError('Administrator control duplicated or missing')
          if html.count("switchModeFromCompactButton('admin')") != 1:
              raise RuntimeError('Original administrator click action missing')
          path.write_text(html, encoding='utf-8')
          print('Settings: gift hidden; existing admin button anchored in header and re-synced after settings render')
          PY

